                                <h4>@${user.username}</h4>
                                <p>Followers: ${user.followers || 0}</p>
                            </div>
                            ${user.banned ? 
                                `<button class="btn btn-secondary" onclick="unbanUser('${user.id}')">Lever bannissement</button>` :
                                `<button class="btn btn-danger" onclick="banUser('${user.id}')">Bannir</button>`
                            }
                        </div>
                    `;
                }
            });

            userList.innerHTML = html;
            adminPanel.style.display = 'block';
            document.getElementById('editProfileForm').style.display = 'none';
            document.getElementById('favoritesSection').style.display = 'none';
        };

        window.banUser = function(userId) {
            if (confirm(t('confirm_ban'))) {
                const currentUser = getCurrentUser();
                if (banUser(currentUser.id, userId)) {
                    showAdminPanel();
                }
            }
        };

        window.unbanUser = function(userId) {
            if (confirm(t('confirm_unban'))) {
                const currentUser = getCurrentUser();
                if (unbanUser(currentUser.id, userId)) {
                    showAdminPanel();
                }
            }
        };

        window.sendAnnouncement = function() {
            const text = document.getElementById('announcementText')?.value;
            if (!text) return;

            const channels = getChannels();
            const ownerChannel = channels.find(c => c.isOwnerChannel);
            const currentUser = getCurrentUser();

            if (ownerChannel && currentUser.isOwner) {
                addChannelMessage(currentUser.id, ownerChannel.id, text);
                document.getElementById('announcementText').value = '';
                showNotification('Annonce envoyée!');
            }
        };

        window.showEditProfileForm = function() {
            document.getElementById('editProfileForm').style.display = 'block';
            document.getElementById('favoritesSection').style.display = 'none';
            if (document.getElementById('adminPanel')) {
                document.getElementById('adminPanel').style.display = 'none';
            }
        };

        window.saveProfile = function() {
            const currentUser = getCurrentUser();
            const newBio = document.getElementById('editBio')?.value || '';
            const newCountry = document.getElementById('editCountry')?.value || 'HT';

            const users = getUsers();
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                users[userIndex].bio = newBio;
                users[userIndex].country = newCountry;
                saveUsers(users);
                
                currentUser.bio = newBio;
                currentUser.country = newCountry;
                setCurrentUser(currentUser);
                
                showNotification('Profil modifié!');
                showPage('profile');
            }
        };

        window.changeProfilePic = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const currentUser = getCurrentUser();
                        const users = getUsers();
                        const userIndex = users.findIndex(u => u.id === currentUser.id);
                        
                        users[userIndex].profilePic = ev.target.result;
                        saveUsers(users);
                        
                        currentUser.profilePic = ev.target.result;
                        setCurrentUser(currentUser);
                        
                        showNotification('Photo de profil modifiée!');
                        showPage('profile');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        };

        window.changeCoverPhoto = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const currentUser = getCurrentUser();
                        const users = getUsers();
                        const userIndex = users.findIndex(u => u.id === currentUser.id);
                        
                        users[userIndex].coverPic = ev.target.result;
                        saveUsers(users);
                        
                        currentUser.coverPic = ev.target.result;
                        setCurrentUser(currentUser);
                        
                        showNotification('Photo de couverture modifiée!');
                        showPage('profile');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        };

        // ------------------------------------------------------------
        // 12. PAGE RECHERCHE
        // ------------------------------------------------------------
        function renderSearchPage(container, currentUser) {
            container.innerHTML = `
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="${t('search')}..." onkeyup="searchUsers()">
                    <button onclick="clearSearch()">✖</button>
                </div>
                
                <div id="searchResults" class="search-results" style="padding:15px;"></div>
                
                <div class="trending">
                    <h3>🔥 Tendance</h3>
                    <div class="trending-item" onclick="searchHashtag('#nosocial')">#nosocial</div>
                    <div class="trending-item" onclick="searchHashtag('#ayiti')">#ayiti</div>
                    <div class="trending-item" onclick="searchHashtag('#video')">#video</div>
                </div>
            `;
        }

        window.searchUsers = function() {
            const query = document.getElementById('searchInput')?.value.toLowerCase().trim();
            if (!query) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            const users = getUsers().filter(u => 
                u.username.toLowerCase().includes(query) || 
                u.bio?.toLowerCase().includes(query)
            );
            const currentUser = getCurrentUser();
            
            let resultsHtml = '';
            users.forEach(user => {
                if (user.id !== currentUser.id && !user.banned) {
                    const country = getCountryByCode(user.country);
                    resultsHtml += `
                        <div class="contact-item" onclick="viewUserProfile('${user.id}')">
                            <div class="avatar">${user.profilePic}</div>
                            <div class="chat-info">
                                <h4>@${user.username} ${user.verified ? '✓' : ''}</h4>
                                <p>${user.bio || ''}</p>
                                <span class="country-flag">${country.flag} ${country.name}</span>
                            </div>
                            <button class="follow-btn" onclick="toggleFollow('${user.id}'); event.stopPropagation();">${t('follow')}</button>
                        </div>
                    `;
                }
            });

            if (resultsHtml === '') resultsHtml = `<p style="padding:15px; color:var(--text-muted);">Aucun résultat</p>`;
            document.getElementById('searchResults').innerHTML = resultsHtml;
        };

        window.viewUserProfile = function(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                showNotification(`Profil de @${user.username}`);
            }
        };

        window.searchHashtag = function(tag) {
            document.getElementById('searchInput').value = tag;
            searchUsers();
        };

        window.clearSearch = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        };

        // ------------------------------------------------------------
        // 13. PAGE UPLOAD
        // ------------------------------------------------------------
        function renderUploadPage(container, currentUser) {
            container.innerHTML = `
                <div class="upload-container">
                    <div class="upload-area" onclick="selectVideo()">
                        <i>📹</i>
                        <p>${t('select_video')}</p>
                    </div>
                    
                    <div id="uploadPreview" class="upload-preview" style="display:none;"></div>
                    
                    <div class="upload-form" style="display:none;" id="uploadForm">
                        <input type="text" id="videoCaption" placeholder="${t('caption')}">
                        <textarea id="videoDescription" rows="3" placeholder="${t('description')}"></textarea>
                        <input type="text" id="videoHashtags" placeholder="${t('hashtags')}">
                        
                        <button class="btn" onclick="publishVideo()">${t('publish')}</button>
                    </div>
                </div>
            `;
        }

        let selectedVideoFile = null;

        window.selectVideo = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.onchange = function(e) {
                selectedVideoFile = e.target.files[0];
                if (selectedVideoFile) {
                    const preview = document.getElementById('uploadPreview');
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(selectedVideoFile);
                    video.controls = true;
                    video.style.width = '100%';
                    preview.innerHTML = '';
                    preview.appendChild(video);
                    preview.style.display = 'block';
                    
                    document.getElementById('uploadForm').style.display = 'block';
                }
            };
            input.click();
        };

        window.publishVideo = function() {
            if (!selectedVideoFile) {
                showNotification('Sélectionnez une vidéo!', 'error');
                return;
            }

            const caption = document.getElementById('videoCaption')?.value || '';
            const hashtags = document.getElementById('videoHashtags')?.value || '';

            const currentUser = getCurrentUser();
            addPost(currentUser.id, selectedVideoFile, caption, hashtags);
            
            showPage('home');
        };

        // ------------------------------------------------------------
        // 14. GESTION DES COMMENTAIRES
        // ------------------------------------------------------------
        let currentPostId = null;
        let replyingToComment = null;

        window.openComments = function(postId) {
            currentPostId = postId;
            replyingToComment = null;
            
            const modal = document.getElementById('commentsModal');
            const commentsList = document.getElementById('commentsList');
            
            loadComments(postId);
            modal.style.display = 'block';
        };

        function loadComments(postId) {
            const comments = getComments(postId);
            const users = getUsers();
            const posts = getPosts();
            const post = posts.find(p => p.id === postId);
            
            let commentsHtml = '';

            // Commentaires principaux (sans parent)
            const mainComments = comments.filter(c => !c.parentId);
            
            mainComments.forEach(comment => {
                const commenter = users.find(u => u.id === comment.userId) || { username: 'Inconnu', profilePic: '?', isOwner: false };
                const isOwner = commenter.isOwner;
                const isPostOwner = comment.userId === post.userId;
                
                commentsHtml += `
                    <div class="comment-item ${isOwner ? 'owner-comment' : ''} ${isPostOwner ? 'post-owner-comment' : ''}">
                        <div class="comment-avatar">${commenter.profilePic}</div>
                        <div class="comment-content">
                            <div class="comment-user">
                                @${commenter.username}
                                ${commenter.verified ? '<span class="verified-badge-small">✓</span>' : ''}
                                ${isPostOwner ? '<span style="color:var(--primary);">👤 Auteur</span>' : ''}
                            </div>
                            <div class="comment-text">${comment.text}</div>
                            <div class="comment-time">${new Date(comment.createdAt).toLocaleString()}</div>
                            <div class="comment-reply" onclick="setReplyTo('${comment.id}', '@${commenter.username}')">
                                ↩️ ${t('reply')}
                            </div>
                            
                            ${loadReplies(postId, comment.id)}
                        </div>
                    </div>
                `;
            });

            if (commentsHtml === '') commentsHtml = `<p style="text-align:center; color:var(--text-muted);">${t('no_comments')}</p>`;
            
            commentsList.innerHTML = commentsHtml;
        }

        function loadReplies(postId, parentId) {
            const comments = getComments(postId);
            const users = getUsers();
            const replies = comments.filter(c => c.parentId === parentId);
            
            let repliesHtml = '';
            replies.forEach(reply => {
                const replier = users.find(u => u.id === reply.userId) || { username: 'Inconnu', profilePic: '?' };
                repliesHtml += `
                    <div class="reply-item">
                        <div class="comment-user">@${replier.username}</div>
                        <div class="comment-text">${reply.text}</div>
                        <div class="comment-time">${new Date(reply.createdAt).toLocaleString()}</div>
                    </div>
                `;
            });
            
            return repliesHtml;
        }

        window.setReplyTo = function(commentId, username) {
            replyingToComment = commentId;
            document.getElementById('commentInput').placeholder = `Répondre à ${username}...`;
        };

        window.closeComments = function() {
            document.getElementById('commentsModal').style.display = 'none';
            replyingToComment = null;
        };

        window.toggleEmojiPicker = function() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'none' ? 'grid' : 'none';
        };

        window.addEmojiToComment = function(emoji) {
            const input = document.getElementById('commentInput');
            input.value += emoji;
            document.getElementById('emojiPicker').style.display = 'none';
        };

        window.postComment = function() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !currentPostId) return;

            const currentUser = getCurrentUser();
            
            if (replyingToComment) {
                addComment(currentPostId, currentUser.id, text, replyingToComment);
            } else {
                addComment(currentPostId, currentUser.id, text);
            }
            
            loadComments(currentPostId);
            input.value = '';
            replyingToComment = null;
            document.getElementById('commentInput').placeholder = t('write_comment');
            
            // Mettre à jour le compteur
            const commentsSpan = document.getElementById(`comments-${currentPostId}`);
            if (commentsSpan) {
                commentsSpan.textContent = getComments(currentPostId).length;
            }
        };

        // ------------------------------------------------------------
        // 15. FONCTIONS DIVERSES
        // ------------------------------------------------------------
        window.viewPost = function(postId) {
            showPage('home');
            // Dans une vraie app, faire défiler jusqu'au post
        };

        window.showFollowers = function() { showNotification('Liste des abonnés'); };
        window.showFollowing = function() { showNotification('Liste des abonnements'); };
        window.showUserPosts = function() { showNotification('Vidéos de l\'utilisateur'); };
        window.sharePost = function() { showNotification('Partager'); };

        // Initialisation
        initData();
        render();
    </script>
</body>
</html>
