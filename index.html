<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>NoGa-Social - Réseau social</title>
    <style>
        /* VARIABLES */
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --secondary: #ff0050;
            --verified: #3897f0;
            --dark: #0a0a0a;
            --darker: #000000;
            --light: #1a1a1a;
            --lighter: #2a2a2a;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--darker);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            line-height: 1.6;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes verifiedPop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        /* SPLASH SCREEN */
        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, var(--darker) 0%, var(--light) 100%);
        }

        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            animation: heartBeat 1.5s infinite;
        }

        .splash-screen h1 {
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* FORMULAIRES */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, var(--darker) 0%, var(--light) 100%);
        }

        .auth-form {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: var(--light);
            border-radius: 30px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        .auth-form h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px;
            background: var(--darker);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .btn-secondary:hover {
            background: #d80044;
        }

        .btn-danger {
            background: #ff3333;
        }

        .btn-danger:hover {
            background: #cc0000;
        }

        .link {
            color: var(--primary);
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            transition: var(--transition);
        }

        .link:hover {
            color: var(--secondary);
        }

        /* MAIN APP */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--darker);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 70px;
            scroll-behavior: smooth;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--light);
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            border-top: 1px solid var(--border);
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .bottom-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 24px;
            padding: 8px 20px;
            border-radius: 30px;
            transition: var(--transition);
        }

        .bottom-nav a.active {
            color: var(--primary);
            background: rgba(37, 211, 102, 0.1);
        }

        /* PAGES */
        .page {
            display: none;
            height: 100%;
            overflow-y: auto;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* VIDEO FEED */
        .video-feed {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .video-container {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: var(--darker);
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: var(--darker);
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--light), var(--lighter));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-muted);
        }

        .video-info {
            position: absolute;
            bottom: 100px;
            left: 20px;
            right: 20px;
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            border: 2px solid var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        .username {
            font-weight: 600;
            font-size: 16px;
            margin-right: 5px;
            cursor: pointer;
        }

        .username:hover {
            text-decoration: underline;
        }

        .verified-badge-small {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: var(--verified);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
            margin-left: 5px;
            margin-right: 10px;
            animation: verifiedPop 0.3s ease;
        }

        .follow-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-left: auto;
        }

        .follow-btn:hover {
            background: #d80044;
            transform: scale(1.05);
        }

        .follow-btn.following {
            background: var(--primary);
        }

        .video-description {
            margin-bottom: 15px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .video-description p {
            color: var(--text);
            font-size: 14px;
        }

        .hashtags {
            color: var(--primary);
            margin-top: 5px;
        }

        .video-actions {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .video-actions button {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: var(--text);
            font-size: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px;
            border-radius: 30px;
            min-width: 60px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            cursor: pointer;
            transition: var(--transition);
        }

        .video-actions button:hover {
            background: rgba(37, 211, 102, 0.8);
            transform: scale(1.1);
        }

        .video-actions button span {
            font-size: 12px;
            font-weight: 600;
        }

        .video-actions button.liked {
            color: var(--secondary);
        }

        /* COMMENTS SECTION */
        .comments-section {
            background: var(--light);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .comments-header h3 {
            font-size: 18px;
            color: var(--primary);
        }

        .close-comments {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-comments:hover {
            color: var(--secondary);
        }

        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            padding: 10px;
            background: var(--darker);
            border-radius: 15px;
            position: relative;
        }

        .comment-item.owner-comment {
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.2), rgba(255, 0, 80, 0.2));
            border-left: 3px solid var(--primary);
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .comment-user {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .comment-text {
            color: var(--text);
            font-size: 14px;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .comment-time {
            color: var(--text-muted);
            font-size: 10px;
        }

        .comment-reply {
            color: var(--primary);
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        .reply-item {
            margin-left: 40px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        .comment-input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: var(--darker);
            border-radius: 25px;
            position: sticky;
            bottom: 0;
        }

        .comment-input-area input {
            flex: 1;
            padding: 12px;
            background: var(--light);
            border: none;
            border-radius: 20px;
            color: var(--text);
            font-size: 14px;
        }

        .comment-input-area input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary);
        }

        .emoji-picker-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }

        .comment-input-area button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .comment-input-area button:hover {
            background: var(--primary-dark);
        }

        /* EMOJI PICKER */
        .emoji-picker {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            padding: 10px;
            background: var(--light);
            border-radius: 15px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .emoji-item {
            font-size: 24px;
            padding: 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            transition: var(--transition);
        }

        .emoji-item:hover {
            background: var(--primary);
            transform: scale(1.2);
        }

        /* CHAT & GROUPES */
        .chat-header {
            background: var(--primary-dark);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .chat-tabs {
            display: flex;
            background: var(--primary-dark);
            padding: 0 20px;
            overflow-x: auto;
        }

        .tab {
            flex: 0 0 auto;
            padding: 15px 20px;
            background: none;
            border: none;
            color: var(--text);
            opacity: 0.7;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            white-space: nowrap;
        }

        .tab.active {
            opacity: 1;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: var(--text);
            border-radius: 3px;
        }

        .group-item, .channel-item, .chat-item, .contact-item, .friend-request-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            align-items: center;
            transition: var(--transition);
        }

        .group-item:hover, .channel-item:hover, .chat-item:hover, .contact-item:hover, .friend-request-item:hover {
            background: var(--light);
        }

        .group-icon, .channel-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 12px;
        }

        .group-icon.owner, .channel-icon.owner {
            background: linear-gradient(135deg, gold, orange);
            border: 2px solid gold;
        }

        .group-info, .channel-info, .chat-info {
            flex: 1;
        }

        .group-info h4, .channel-info h4, .chat-info h4 {
            margin-bottom: 5px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .group-info p, .channel-info p, .chat-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .owner-badge {
            background: gold;
            color: black;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .verified-badge {
            background: var(--verified);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            display: inline-block;
        }

        .unread {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            min-width: 24px;
            text-align: center;
        }

        .friend-request-badge {
            background: var(--secondary);
            color: white;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 10px;
        }

        .accept-btn, .reject-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 5px;
            transition: var(--transition);
        }

        .accept-btn {
            background: var(--primary);
            color: white;
        }

        .accept-btn:hover {
            background: var(--primary-dark);
        }

        .reject-btn {
            background: var(--secondary);
            color: white;
        }

        .reject-btn:hover {
            background: #d80044;
        }

        .ban-btn {
            background: #ff3333;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 15px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* CHAT WINDOW */
        .chat-window {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--darker);
            z-index: 2000;
            display: none;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }

        .chat-window.active {
            display: flex;
        }

        .chat-window-header {
            background: var(--primary-dark);
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }

        .chat-window-header .back {
            font-size: 28px;
            margin-right: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .chat-window-header .back:hover {
            transform: scale(1.1);
        }

        .chat-window-header .header-info {
            flex: 1;
        }

        .chat-window-header .header-info h3 {
            font-size: 16px;
        }

        .chat-window-header .header-info p {
            font-size: 12px;
            opacity: 0.8;
        }

        .chat-window-header .header-actions {
            display: flex;
            gap: 15px;
        }

        .chat-window-header .header-actions span {
            font-size: 20px;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--light);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message.owner-message {
            background: linear-gradient(135deg, gold, orange);
            color: black;
            font-weight: 500;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: var(--light);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 15px;
            background: var(--darker);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 16px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-input-area button {
            padding: 15px 30px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .chat-input-area button:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* CREATE GROUP/CHANNEL */
        .create-form {
            padding: 20px;
            background: var(--light);
            border-radius: 20px;
            margin: 20px;
        }

        .create-form h3 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        /* PROFILE */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary) 100%);
            padding: 20px;
            position: relative;
        }

        .cover-photo {
            height: 150px;
            background: linear-gradient(45deg, var(--light), var(--lighter));
            border-radius: 20px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
        }

        .cover-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-edit {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: var(--transition);
        }

        .cover-edit:hover {
            background: rgba(37, 211, 102, 0.8);
        }

        .profile-pic-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-bottom: 10px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 4px solid var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .profile-pic-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--text);
            transition: var(--transition);
        }

        .profile-pic-edit:hover {
            background: var(--secondary);
            transform: scale(1.1);
        }

        .profile-info {
            padding: 0 20px;
        }

        .profile-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stats div {
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .stats div:hover {
            transform: scale(1.1);
        }

        .stats strong {
            display: block;
            font-size: 20px;
            color: var(--primary);
        }

        .stats span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .bio {
            margin: 20px 0;
            padding: 15px;
            background: var(--light);
            border-radius: 15px;
        }

        .country-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .country-flag {
            font-size: 24px;
        }

        .edit-profile-form {
            padding: 20px;
            background: var(--light);
            border-radius: 20px;
            margin: 20px;
        }

        .profile-videos {
            padding: 15px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .video-grid-item {
            background: var(--light);
            aspect-ratio: 9/16;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .video-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-grid-item .stats-overlay {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 10px;
            display: flex;
            gap: 5px;
        }

        /* SEARCH */
        .search-bar {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: var(--light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-bar input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: none;
            background: var(--darker);
            color: var(--text);
            font-size: 16px;
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary);
        }

        .search-bar button {
            width: 50px;
            border-radius: 50%;
            border: none;
            background: var(--darker);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        .search-bar button:hover {
            background: var(--primary);
            transform: rotate(90deg);
        }

        .trending {
            padding: 20px;
        }

        .trending h3 {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .trending-item {
            background: var(--light);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .trending-item:hover {
            background: var(--lighter);
            transform: translateX(10px);
        }

        /* UPLOAD */
        .upload-container {
            padding: 20px;
        }

        .upload-area {
            background: var(--light);
            border: 2px dashed var(--primary);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

            background: var(--lighter);
            border-color: var(--secondary);
        }

            font-size: 60px;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }

        .upload-area p {
            color: var(--text-muted);
        }

        .upload-preview {
            margin: 20px 0;
            border-radius: 15px;
            overflow: hidden;
            max-height: 300px;
        }

        .upload-preview video {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }

        .upload-form input, .upload-form textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text);
        }

        /* FAVORITES */
        .favorites-list {
            padding: 15px;
        }

        .favorite-item {
            display: flex;
            padding: 10px;
            background: var(--light);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .favorite-thumb {
            width: 60px;
            height: 60px;
            background: var(--darker);
            border-radius: 10px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favorite-info {
            flex: 1;
        }

        .favorite-info h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .favorite-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ADMIN PANEL */
        .admin-panel {
            padding: 20px;
        }

        .admin-section {
            background: var(--light);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .admin-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .user-list-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

            font-size: 14px;

        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            padding: 15px 25px;

        }

            gap: 10px;
        }

            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

            font-size: 20px;

function getCountryByCode(code) {
    return COUNTRIES.find(c => c.code === code) || COUNTRIES[0];
}

function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.remove();
    }, 3000);
}

function registerUser(username, email, password, country) {
    const users = getUsers();
    
    if (users.find(u => u.email === email)) {
        showNotification('Cet email existe déjà!', 'error');
        return null;
    }

    if (users.find(u => u.username === username)) {
        showNotification('Ce nom d\'utilisateur existe déjà!', 'error');
        return null;
    }

    const newUser = {
        id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        username: username,
        email: email,
        password: password,
        country: country,
        bio: '',
        profilePic: username.charAt(0).toUpperCase(),
        coverPic: null,
        followers: 0,
        following: 0,
        verified: false,
        isOwner: false,
        totalLikes: 0,
        createdAt: new Date().toISOString()
    };

    users.push(newUser);
    saveUsers(users);

    // Abonnement automatique au propriétaire
    const owner = users.find(u => u.isOwner);
    if (owner) {
        newUser.following = 1;
        owner.followers = (owner.followers || 0) + 1;
        saveUsers(users);
    }

    // Ajouter automatiquement au groupe officiel
    const groups = JSON.parse(localStorage.getItem(STORAGE_KEYS.GROUPS)) || [];
    const ownerGroup = groups.find(g => g.isOwnerGroup);
    if (ownerGroup) {
        if (!ownerGroup.members) ownerGroup.members = [];
        ownerGroup.members.push(newUser.id);
        localStorage.setItem(STORAGE_KEYS.GROUPS, JSON.stringify(groups));
    }

    // Ajouter automatiquement à la chaîne officielle
    const channels = JSON.parse(localStorage.getItem(STORAGE_KEYS.CHANNELS)) || [];
    const ownerChannel = channels.find(c => c.isOwnerChannel);
    if (ownerChannel) {
        if (!ownerChannel.subscribers) ownerChannel.subscribers = [];
        ownerChannel.subscribers.push(newUser.id);
        localStorage.setItem(STORAGE_KEYS.CHANNELS, JSON.stringify(channels));
    }

    // Initialiser les données pour l'utilisateur
    const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES)) || {};
    messages[newUser.id] = {};
    localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(messages));

    const friends = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIENDS)) || {};
    friends[newUser.id] = [];
    localStorage.setItem(STORAGE_KEYS.FRIENDS, JSON.stringify(friends));

    const favorites = JSON.parse(localStorage.getItem(STORAGE_KEYS.FAVORITES)) || {};
    favorites[newUser.id] = [];
    localStorage.setItem(STORAGE_KEYS.FAVORITES, JSON.stringify(favorites));

    showNotification('Inscription réussie! Bienvenue sur NoGa-Social!');
    return newUser;
}

function loginUser(email, password) {
    const users = getUsers();
    const user = users.find(u => u.email === email && u.password === password);
    if (user) {
        showNotification(`Bonjour @${user.username}!`);
        return user;
    }
    showNotification('Email ou mot de passe incorrect!', 'error');
    return null;
}

function isUserVerified(user) {
    if (user.isOwner) return true;
    return user.followers >= 10000;
}

function banUser(ownerId, userIdToBan) {
    const users = getUsers();
    const owner = users.find(u => u.id === ownerId);
    
    if (!owner || !owner.isOwner) {
        showNotification('Seul le propriétaire peut bannir!', 'error');
        return false;
    }

    const userToBan = users.find(u => u.id === userIdToBan);
    if (userToBan) {
        userToBan.banned = true;
        saveUsers(users);
        showNotification(`Utilisateur @${userToBan.username} banni!`, 'warning');
        return true;
    }
    return false;
}

function unbanUser(ownerId, userIdToUnban) {
    const users = getUsers();
    const owner = users.find(u => u.id === ownerId);
    
    if (!owner || !owner.isOwner) {
        showNotification('Seul le propriétaire peut lever le bannissement!', 'error');
        return false;
    }

    const userToUnban = users.find(u => u.id === userIdToUnban);
    if (userToUnban) {
        userToUnban.banned = false;
        saveUsers(users);
        showNotification(`Bannissement levé pour @${userToUnban.username}`);
        return true;
    }
    return false;
}

function addPost(userId, videoFile, caption, hashtags) {

    const newPost = {

        userId: userId,
        videoUrl: videoFile ? URL.createObjectURL(videoFile) : null,
        caption: caption,

        createdAt: new Date().toISOString()
    };
    posts.push(newPost);
    savePosts(posts);
    showNotification('Vidéo publiée!');
    return newPost;
}

function likePost(postId, userId) {
    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (post) {
        if (!post.likes) post.likes = [];
        
        if (post.likes.includes(userId)) {
            // Unlike
            post.likes = post.likes.filter(id => id !== userId);
            
            // Mettre à jour le total de likes de l'utilisateur
            const users = getUsers();
            const postOwner = users.find(u => u.id === post.userId);
            if (postOwner) {
                postOwner.totalLikes = (postOwner.totalLikes || 1) - 1;
                saveUsers(users);
            }
        } else {
            // Like
            post.likes.push(userId);
            
            // Mettre à jour le total de likes de l'utilisateur
            const users = getUsers();
            const postOwner = users.find(u => u.id === post.userId);
            if (postOwner) {
                postOwner.totalLikes = (postOwner.totalLikes || 0) + 1;
                saveUsers(users);
            }
        }
        savePosts(posts);
        return post.likes.length;
    }
    return 0;
}

function isPostLikedByUser(postId, userId) {
    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (post && post.likes) {
        return post.likes.includes(userId);
    }
    return false;
}

        userId: userId,
        text: text,

        createdAt: new Date().toISOString()
    };
    
    comments[postId].push(newComment);
    localStorage.setItem(STORAGE_KEYS.COMMENTS, JSON.stringify(comments));
    
    return newComment;
}

function getComments(postId) {
    const comments = JSON.parse(localStorage.getItem(STORAGE_KEYS.COMMENTS)) || {};
    return comments[postId] || [];
}

function getCommentsByParent(postId, parentId = null) {
    const allComments = getComments(postId);
    return allComments.filter(c => c.parentId === parentId);
}

function addToFavorites(userId, postId) {
    const favorites = JSON.parse(localStorage.getItem(STORAGE_KEYS.FAVORITES)) || {};
    if (!favorites[userId]) favorites[userId] = [];

            timestamp: new Date().toISOString()
        });
        saveGroups(groups);
        return true;

function sendFriendRequest(fromUserId, toUserId) {
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIEND_REQUESTS)) || {};
    if (!requests[toUserId]) requests[toUserId] = [];
    
    const friends = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIENDS)) || {};
    if (friends[fromUserId] && friends[fromUserId].includes(toUserId)) {
        showNotification('Vous êtes déjà amis!', 'error');
        return false;
    }

    if (!requests[toUserId].includes(fromUserId)) {
        requests[toUserId].push(fromUserId);
        localStorage.setItem(STORAGE_KEYS.FRIEND_REQUESTS, JSON.stringify(requests));
        showNotification('Demande d\'ami envoyée!');
        return true;
    }
    showNotification('Demande déjà envoyée!', 'warning');
    return false;
}

function acceptFriendRequest(myId, friendId) {
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIEND_REQUESTS)) || {};
    if (requests[myId]) {
        requests[myId] = requests[myId].filter(id => id !== friendId);
        localStorage.setItem(STORAGE_KEYS.FRIEND_REQUESTS, JSON.stringify(requests));
    }

    const friends = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIENDS)) || {};
    if (!friends[myId]) friends[myId] = [];
    if (!friends[friendId]) friends[friendId] = [];

    if (!friends[myId].includes(friendId)) {
        friends[myId].push(friendId);
    }
    if (!friends[friendId].includes(myId)) {
        friends[friendId].push(myId);
    }

    localStorage.setItem(STORAGE_KEYS.FRIENDS, JSON.stringify(friends));
    showNotification('Demande acceptée!');
    return true;
}

function rejectFriendRequest(myId, friendId) {
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIEND_REQUESTS)) || {};
    if (requests[myId]) {
        requests[myId] = requests[myId].filter(id => id !== friendId);
        localStorage.setItem(STORAGE_KEYS.FRIEND_REQUESTS, JSON.stringify(requests));
    }
    showNotification('Demande refusée!');
}

function getFriendRequests(userId) {
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIEND_REQUESTS)) || {};
    return requests[userId] || [];
}

function getFriends(userId) {
    const friends = JSON.parse(localStorage.getItem(STORAGE_KEYS.FRIENDS)) || {};
    return friends[userId] || [];
}

function sendMessage(fromId, toId, text) {
    const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES)) || {};
    const chatId = [fromId, toId].sort().join('_');
    
    if (!messages[chatId]) {
        messages[chatId] = [];
    }

    messages[chatId].push({
        from: fromId,
        to: toId,
        text: text,
        timestamp: new Date().toISOString()
    });

    localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(messages));
}

function getMessages(userId1, userId2) {
    const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES)) || {};
    const chatId = [userId1, userId2].sort().join('_');
    return messages[chatId] || [];
}

window.handleRegister = function() {
    const username = document.getElementById('regUsername')?.value.trim();
    const email = document.getElementById('regEmail')?.value.trim();
    const password = document.getElementById('regPassword')?.value;
    const confirm = document.getElementById('regConfirmPassword')?.value;
    const country = document.getElementById('regCountry')?.value;

    if (!username || !email || !password || !confirm) {
        showNotification('Veuillez remplir tous les champs!', 'error');
        return;
    }

    if (password !== confirm) {
        showNotification('Les mots de passe ne correspondent pas!', 'error');
        return;
    }

    const newUser = registerUser(username, email, password, country);
    if (newUser) {
        setCurrentUser(newUser);
        render();
    }
};

window.handleLogin = function() {
    const email = document.getElementById('loginEmail')?.value.trim();
    const password = document.getElementById('loginPassword')?.value;

    if (!email || !password) {
        showNotification('Veuillez remplir tous les champs!', 'error');
        return;
    }

    const user = loginUser(email, password);
    if (user) {
        if (user.banned) {
            showNotification('Ce compte a été banni par le propriétaire!', 'error');
            return;
        }
        setCurrentUser(user);
        render();
    }
};

window.showPage = function(pageId) {
    const content = document.getElementById('mainContent');
    if (!content) return;

    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('data-page') === pageId) {
            item.classList.add('active');
        }
    });

    if (pageId === 'home') renderHomePage(content, getCurrentUser());
    else if (pageId === 'chat') renderChatPage(content, getCurrentUser());
    else if (pageId === 'profile') renderProfilePage(content, getCurrentUser());
    else if (pageId === 'search') renderSearchPage(content, getCurrentUser());
    else if (pageId === 'upload') renderUploadPage(content, getCurrentUser());
};

function renderHomePage(container, currentUser) {
    const users = getUsers();
    const posts = getPosts().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    
    let videosHtml = '';

    if (posts.length === 0) {
        videosHtml = `<div style="padding:20px; text-align:center; color:var(--text-muted);">${t('no_videos')}</div>`;
    } else {
        posts.forEach(post => {
            const poster = users.find(u => u.id === post.userId) || currentUser;
            const country = getCountryByCode(poster.country);
            const isLiked = isPostLikedByUser(post.id, currentUser.id);
            const likesCount = post.likes ? post.likes.length : 0;
            
            videosHtml += `
                <div class="video-container" data-post-id="${post.id}">
                    ${post.videoUrl ? 
                        `<video class="video-player" src="${post.videoUrl}" loop controls></video>` : 
                        `<div class="video-placeholder">🎥</div>`
                    }
                    
                    <div class="video-info">
                        <div class="user-info">
                            <div class="avatar" onclick="viewUserProfile('${poster.id}')">${poster.profilePic}</div>
                            <span class="username" onclick="viewUserProfile('${poster.id}')">@${poster.username}</span>
                            ${poster.verified ? '<span class="verified-badge-small">✓</span>' : ''}
                            <span class="country-flag" title="${country.name}">${country.flag}</span>
                            <button class="follow-btn" onclick="toggleFollow('${poster.id}')">
                                ${t('follow')}
                            </button>
                        </div>
                        
                        <div class="video-description">
                            <p>${post.caption || ''}</p>
                            <div class="hashtags">${post.hashtags || ''}</div>
                        </div>
                    </div>
                    
                    <div class="video-actions">
                        <button class="${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                            ❤️ <span id="likes-${post.id}">${likesCount}</span>
                        </button>
                        <button onclick="openComments('${post.id}')">
                            💬 <span id="comments-${post.id}">${getComments(post.id).length}</span>
                        </button>
                        <button onclick="sharePost('${post.id}')">
                            🔗 <span>${post.shares || 0}</span>
                        </button>
                        <button onclick="toggleFavorite('${post.id}')">
                            ⭐ <span id="favorites-${post.id}">${post.favorites || 0}</span>
                        </button>
                        <button onclick="sendFriendRequestFromVideo('${poster.id}')">
                            ➕
                        </button>
                    </div>
                </div>
            `;
        });
    }

    container.innerHTML = `
        <div class="video-feed">
            ${videosHtml}
        </div>
    `;
}

window.toggleLike = function(postId) {
    const currentUser = getCurrentUser();
    const newCount = likePost(postId, currentUser.id);
    
    const likesSpan = document.getElementById(`likes-${postId}`);
    if (likesSpan) {
        likesSpan.textContent = newCount;
        
        const btn = likesSpan.parentElement;
        if (isPostLikedByUser(postId, currentUser.id)) {
            btn.classList.add('liked');
            showHeartAnimation();
        } else {
            btn.classList.remove('liked');
        }
    }
};

window.showHeartAnimation = function() {
    const heart = document.createElement('div');
    heart.innerHTML = '❤️';
    heart.style.position = 'fixed';
    heart.style.top = '50%';
    heart.style.left = '50%';
    heart.style.fontSize = '100px';
    heart.style.transform = 'translate(-50%, -50%)';
    heart.style.zIndex = '9999';
    heart.style.pointerEvents = 'none';
    heart.style.animation = 'heartBeat 1s ease';
    document.body.appendChild(heart);
    
    setTimeout(() => {
        heart.remove();
    }, 1000);
};

window.toggleFollow = function(userId) {
    const currentUser = getCurrentUser();
    const users = getUsers();
    const targetUser = users.find(u => u.id === userId);
    const currentUserObj = users.find(u => u.id === currentUser.id);

    if (targetUser && currentUserObj) {
        currentUserObj.following = (currentUserObj.following || 0) + 1;
        targetUser.followers = (targetUser.followers || 0) + 1;

        saveUsers(users);
        setCurrentUser(currentUserObj);

        if (targetUser.followers >= 10000 && !targetUser.verified) {
            targetUser.verified = true;
            saveUsers(users);
            showNotification(`Félicitations! @${targetUser.username} est maintenant vérifié!`);
        }

        const btn = event.target;
        btn.textContent = t('following');
        btn.classList.add('following');
    }
};

window.toggleFavorite = function(postId) {
    const currentUser = getCurrentUser();
    const favorites = getFavorites(currentUser.id);
    
    if (favorites.includes(postId)) {
        removeFromFavorites(currentUser.id, postId);
    } else {
        addToFavorites(currentUser.id, postId);
    }
};

window.sendFriendRequestFromVideo = function(userId) {
    const currentUser = getCurrentUser();
    sendFriendRequest(currentUser.id, userId);
};

function renderChatPage(container, currentUser) {
    const friends = getFriends(currentUser.id);
    const friendRequests = getFriendRequests(currentUser.id);
    const groups = getGroups();
    const channels = getChannels();
    const users = getUsers();
    
    // Groupes (y compris le groupe officiel)
    let groupsHtml = '';
    groups.forEach(group => {
        if (group.members.includes(currentUser.id) || group.isOwnerGroup) {
            const isOwner = group.createdBy === currentUser.id || group.isOwnerGroup;
            groupsHtml += `
                <div class="group-item" onclick="openGroupChat('${group.id}')">
                    <div class="group-icon ${isOwner ? 'owner' : ''}">👥</div>
                    <div class="group-info">
                        <h4>
                            ${group.name}
                            ${isOwner ? '<span class="owner-badge">👑</span>' : ''}
                        </h4>
                        <p>${group.description || ''}</p>
                        <p>${group.members ? group.members.length : 0} membres</p>
                    </div>
                </div>
            `;
        }
    });

    if (groupsHtml === '') groupsHtml = `<p style="padding:15px; color:var(--text-muted);">${t('no_groups')}</p>`;

    // Chaînes (y compris la chaîne officielle)
    let channelsHtml = '';
    channels.forEach(channel => {
        if (channel.subscribers.includes(currentUser.id) || channel.isOwnerChannel) {
            const isOwner = channel.createdBy === currentUser.id || channel.isOwnerChannel;
            channelsHtml += `
                <div class="channel-item" onclick="openChannelChat('${channel.id}')">
                    <div class="channel-icon ${isOwner ? 'owner' : ''}">📢</div>
                    <div class="channel-info">
                        <h4>
                            ${channel.name}
                            ${isOwner ? '<span class="owner-badge">👑</span>' : ''}
                        </h4>
                        <p>${channel.description || ''}</p>
                        <p>${channel.subscribers ? channel.subscribers.length : 0} abonnés</p>
                    </div>
                </div>
            `;
        }
    });

    if (channelsHtml === '') channelsHtml = `<p style="padding:15px; color:var(--text-muted);">${t('no_channels')}</p>`;

    // Demandes d'ami
    let requestsHtml = '';
    friendRequests.forEach(friendId => {
        const requester = users.find(u => u.id === friendId);
        if (requester) {
            requestsHtml += `
                <div class="friend-request-item">
                    <div class="avatar">${requester.profilePic}</div>
                    <div class="chat-info">
                        <h4>@${requester.username}</h4>
                        <p>${requester.bio || ''}</p>
                    </div>
                    <button class="accept-btn" onclick="acceptFriendRequest('${currentUser.id}', '${friendId}')">${t('accept')}</button>
                    <button class="reject-btn" onclick="rejectFriendRequest('${currentUser.id}', '${friendId}')">${t('reject')}</button>
                </div>
            `;
        }
    });

    if (requestsHtml === '') requestsHtml = `<p style="padding:15px; color:var(--text-muted);">${t('no_requests')}</p>`;

    // Amis
    let friendsHtml = '';
    friends.forEach(friendId => {
        const friend = users.find(u => u.id === friendId);
        if (friend) {
            friendsHtml += `
                <div class="chat-item" onclick="openPrivateChat('${friend.id}')">
                    <div class="avatar">${friend.profilePic}</div>
                    <div class="chat-info">
                        <h4>@${friend.username} ${friend.verified ? '✓' : ''}</h4>
                        <p>${friend.bio || ''}</p>
                    </div>
                    <span class="country-flag">${getCountryByCode(friend.country).flag}</span>
                </div>
            `;
        }
    });

    if (friendsHtml === '') friendsHtml = `<p style="padding:15px; color:var(--text-muted);">${t('no_friends')}</p>`;

    container.innerHTML = `
        <div class="chat-header">
            <h2>${t('messages')}</h2>
        </div>

        <div class="chat-tabs">
            <button class="tab active" onclick="switchChatTab('chats')">💬 ${t('messages')}</button>
            <button class="tab" onclick="switchChatTab('groups')">👥 ${t('groups')}</button>
            <button class="tab" onclick="switchChatTab('channels')">📢 ${t('channels')}</button>
            <button class="tab" onclick="switchChatTab('requests')">➕ ${t('friend_request')} ${friendRequests.length > 0 ? `<span class="friend-request-badge">${friendRequests.length}</span>` : ''}</button>
        </div>

        <div id="chatsTab" style="display:block;">
            <div style="padding:15px; display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="showCreateGroupForm()" style="flex:1;">${t('create_group')}</button>
                <button class="btn btn-secondary" onclick="showCreateChannelForm()" style="flex:1;">${t('create_channel')}</button>
            </div>
            <h3 style="padding:15px;">${t('friends')}</h3>
            ${friendsHtml}
        </div>

        <div id="groupsTab" style="display:none;">
            <h3 style="padding:15px;">${t('groups')}</h3>
            ${groupsHtml}
        </div>

        <div id="channelsTab" style="display:none;">
            <h3 style="padding:15px;">${t('channels')}</h3>
            ${channelsHtml}
        </div>

        <div id="requestsTab" style="display:none;">
            <h3 style="padding:15px;">${t('friend_request')}</h3>
            ${requestsHtml}
        </div>
    `;
}

window.switchChatTab = function(tab) {
    document.querySelectorAll('.chat-tabs .tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('chatsTab').style.display = tab === 'chats' ? 'block' : 'none';
    document.getElementById('groupsTab').style.display = tab === 'groups' ? 'block' : 'none';
    document.getElementById('channelsTab').style.display = tab === 'channels' ? 'block' : 'none';
    document.getElementById('requestsTab').style.display = tab === 'requests' ? 'block' : 'none';
};

// GESTION DES CHATS
let currentChatType = 'private'; // private, group, channel
let currentChatId = null;

window.openPrivateChat = function(userId) {
    const users = getUsers();
    const user = users.find(u => u.id === userId);
    if (!user) return;

    currentChatType = 'private';
    currentChatId = userId;

    document.getElementById('chatHeaderInfo').innerHTML = `
        <h3>@${user.username}</h3>
        <p>${user.bio || ''}</p>
    `;
    document.getElementById('chatWindow').classList.add('active');
    document.getElementById('chatInput').disabled = false;
    document.getElementById('chatSendBtn').disabled = false;
    
    loadPrivateMessages(userId);
};

window.openGroupChat = function(groupId) {
    const groups = getGroups();
    const group = groups.find(g => g.id === groupId);
    if (!group) return;

    const currentUser = getCurrentUser();
    currentChatType = 'group';
    currentChatId = groupId;

    document.getElementById('chatHeaderInfo').innerHTML = `
        <h3>${group.name}</h3>
        <p>${group.description || ''} · ${group.members ? group.members.length : 0} membres</p>
    `;
    
    // Vérifier si l'utilisateur peut écrire (membre)
    const canWrite = group.members.includes(currentUser.id) || group.isOwnerGroup;
    document.getElementById('chatInput').disabled = !canWrite;
    document.getElementById('chatSendBtn').disabled = !canWrite;
    
    document.getElementById('chatWindow').classList.add('active');
    loadGroupMessages(groupId);
};

window.openChannelChat = function(channelId) {
    const channels = getChannels();
    const channel = channels.find(c => c.id === channelId);
    if (!channel) return;

    const currentUser = getCurrentUser();
    currentChatType = 'channel';
    currentChatId = channelId;

    document.getElementById('chatHeaderInfo').innerHTML = `
        <h3>${channel.name}</h3>
        <p>${channel.description || ''} · ${channel.subscribers ? channel.subscribers.length : 0} abonnés</p>
    `;
    
    // Seul le propriétaire peut écrire dans sa chaîne
    const canWrite = currentUser.isOwner && channel.isOwnerChannel;
    document.getElementById('chatInput').disabled = !canWrite;
    document.getElementById('chatSendBtn').disabled = !canWrite;
    
    if (currentUser.isOwner && channel.isOwnerChannel) {
        document.getElementById('chatInput').placeholder = "Écrire une annonce...";
    }
    
    document.getElementById('chatWindow').classList.add('active');
    loadChannelMessages(channelId);
};

function loadPrivateMessages(userId) {
    const currentUser = getCurrentUser();
    const messages = getMessages(currentUser.id, userId);
    const users = getUsers();
    const contact = users.find(u => u.id === userId);

    const messagesContainer = document.getElementById('chatMessages');
    messagesContainer.innerHTML = '';

    messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = msg.from === currentUser.id ? 'message sent' : 'message received';
        
        const time = new Date(msg.timestamp).toLocaleTimeString();
        div.innerHTML = `${msg.text}<div class="message-time">${time}</div>`;
        
        messagesContainer.appendChild(div);
    });

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function loadGroupMessages(groupId) {
    const groups = getGroups();
    const group = groups.find(g => g.id === groupId);
    const currentUser = getCurrentUser();
    const users = getUsers();

    const messagesContainer = document.getElementById('chatMessages');
    messagesContainer.innerHTML = '';

    if (group.messages) {
        group.messages.forEach(msg => {
            const sender = users.find(u => u.id === msg.userId) || { username: 'Inconnu', profilePic: '?' };
            const div = document.createElement('div');
            div.className = msg.userId === currentUser.id ? 'message sent' : 'message received';
            
            const time = new Date(msg.timestamp).toLocaleTimeString();
            div.innerHTML = `<strong>@${sender.username}</strong><br>${msg.text}<div class="message-time">${time}</div>`;
            
            messagesContainer.appendChild(div);
        });
    }

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function loadChannelMessages(channelId) {
    const channels = getChannels();
    const channel = channels.find(c => c.id === channelId);
    const currentUser = getCurrentUser();

    const messagesContainer = document.getElementById('chatMessages');
    messagesContainer.innerHTML = '';

    if (channel.messages) {
        channel.messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = currentUser.isOwner ? 'message sent owner-message' : 'message received';
            
            const time = new Date(msg.timestamp).toLocaleTimeString();
            div.innerHTML = `📢 <strong>Annonce:</strong><br>${msg.text}<div class="message-time">${time}</div>`;
            
            messagesContainer.appendChild(div);
        });
    }

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

window.closeChatWindow = function() {
    document.getElementById('chatWindow').classList.remove('active');
};

window.sendChatMessage = function() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    const currentUser = getCurrentUser();

    if (currentChatType === 'private') {
        sendMessage(currentUser.id, currentChatId, text);
        loadPrivateMessages(currentChatId);
    } 
    else if (currentChatType === 'group') {
        addGroupMessage(currentUser.id, currentChatId, text);
        loadGroupMessages(currentChatId);
    }
    else if (currentChatType === 'channel') {
        if (currentUser.isOwner) {
            addChannelMessage(currentUser.id, currentChatId, text);
            loadChannelMessages(currentChatId);
        }
    }

    input.value = '';
};
